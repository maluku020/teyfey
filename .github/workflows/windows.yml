name: Build Teyfey Windows
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle VLC 64-bit (so the PC needs no separate VLC)
        shell: pwsh
        run: |
          $v = "3.0.21"
          Invoke-WebRequest "https://download.videolan.org/pub/videolan/vlc/$v/win64/vlc-$v-win64.zip" -OutFile vlc.zip
          Expand-Archive vlc.zip -DestinationPath vlctmp
          $dst = "appresources/windows-x64/vlc"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "vlctmp/vlc-$v/libvlc.dll", "vlctmp/vlc-$v/libvlccore.dll" $dst
          Copy-Item -Recurse "vlctmp/vlc-$v/plugins" "$dst/plugins"
      - name: Build installer + portable
        shell: bash
        run: ./gradlew packageMsi createDistributable --no-daemon --stacktrace
      - name: Collect files
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName ../Teyfey-Windows.msi
          Compress-Archive -Path build/compose/binaries/main/app/Teyfey -DestinationPath ../Teyfey-Windows-portable.zip
      # Fixed release "windows" (not "latest", so the Android link keeps working).
      # Direct link: https://github.com/maluku020/teyfey/releases/download/windows/Teyfey-Windows.msi
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows
          name: Teyfey voor Windows
          body: "Nieuwste Windows-versie (build ${{ github.run_number }}): ${{ github.event.head_commit.message }}"
          files: |
            Teyfey-Windows.msi
            Teyfey-Windows-portable.zip
          make_latest: false
